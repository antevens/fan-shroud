# Measurements for this machine. All values in millimetres.
# Keys listed under [todo].unmeasured are still estimates; the build warns while they are listed.

[printer]
printer_model = "Elegoo Centauri Carbon 2 Combo"
bed_x = 256.0
bed_y = 256.0
bed_z = 256.0
nozzle_diameter = 0.4
bed_margin = 5.0

[fan]
# Case mount only: the separate 80 mm duct. The card-clip shroud uses the [tail] fan below.
fan_size = 80.0
# Noctua NF-A8 is 25 mm deep; a 15 mm slim fan would pull the intake 10 mm back.
fan_depth = 25.0
fan_hole_spacing = 71.5
fan_hole_diameter = 4.3
fan_flange_size = 83.0
fan_flange_thickness = 6.0
# Fan screws go in the usual way, from the duct side into the fan frame's 4.3 mm holes: a clearance
# hole through the corner pad, the head seated fan_screw_seat from the fan face. Behind each pad a sealed
# tube carries a head-size bore straight through to the outlet face, so a driver reaches every screw
# from the outlet side before the shroud goes on. Fan screw heads are about 7 mm; check on the flange coupon.
fan_screw_clearance = 5.2
fan_screw_head_clearance = 7.6
fan_screw_seat = 3.0
fan_screw_tube_wall = 1.6
# Standard fan screws; the thread reaches fan_screw_length - fan_screw_seat into the fan frame.
fan_screw_length = 10.0
fan_corner_pad = 9.0
# 45 deg gusset behind each pad narrows to this square end.
fan_gusset_tip = 2.0
# Gap kept between the top of the fan end and the GPU underside.
fan_gpu_clearance = 3.0
# Free space wanted in front of the fan intake.
fan_intake_clearance = 20.0
# Fan axis position overrides. Omit to centre on the card zone and sit just under the GPU.
# fan_center_y = 45.0
# fan_center_z = 20.0

[slots]
slot_pitch = 20.32
# Supermicro H12DSi-N6: SLOT6 (x16, top) holds the GPU. Its 55 mm body blocks SLOT5 and SLOT4.
# SLOT3 (x8), SLOT2 (x16) and SLOT1 (x8) remain: three channels.
slot_positions_covered = 3
# Distance from a card's PCB plane down to the floor of its channel (component side). 24 mm after the
# 2026-10-18 test fit: the prototype needed 8 mm more between the bottom plate and the top card's edge
# (the bottom card's finned heatsink hangs toward the midplate).
channel_floor_below_pcb = 24.0
# TODO: midplate top -> PCB plane of SLOT1 (measure at the slot connector opening).
bottom_slot_pcb_to_midplate = 40.0
# Slot pitches from the top covered PCB (SLOT3) up to the GPU's PCB (SLOT6).
gpu_slot_gap = 3
# TODO: XFX MERC310 RX 7900 XT is 344 x 128 x 55 mm; verify the shroud underside below its PCB plane.
gpu_underside_below_pcb = 52.0
gpu_length = 344.0
gpu_top_clearance = 1.5

[case]
outlet_card_clearance = 5.0
exhaust_gap = 20.0
# Case mount only: wall margin beyond the tallest card's top edge.
card_top_margin = 2.0
# PCIe slot connector housing height above the motherboard; the cover lid starts beyond it.
connector_height = 11.25
# Gap kept between the motherboard surface and the duct's outer wall (headers, SATA ports).
motherboard_clearance = 5.0
# Low-profile card top edge -> side panel: 184 mm CPU cooler limit minus 72.4, less foam. TODO: measure.
side_clearance = 110.0
# TODO: free length in front of the outlet plane before the midplate cable cutout / cables.
free_length_from_outlet = 80.0
# TODO: confirm the gap between the midplate and the PSU.
under_midplate_gap = 15.0
# TODO: midplate cutouts as [x0, x1, y0, y1] in the duct frame (x negative from the bracket plane).
cutouts = []

[midplate]
# Phanteks XT Pro shroud: staggered rectangular slots. TODO: measure slot size and pitches.
hole_pattern = "slots"
slot_length = 7.0
slot_width = 3.0
# Pitch along X between slots in a row, and row pitch along Y (rows staggered by half a pitch).
hole_pitch = 9.5
hole_row_pitch_override = 5.5
hole_diameter = 3.0
sheet_thickness = 0.8
# TODO: centre of any one slot: X from the bracket plane (negative), Y from the motherboard.
perforation_origin_x = 0.0
perforation_origin_y = 0.0

[duct]
wall_thickness = 2.0
min_wall_thickness = 1.6
vane_thickness = 1.6
# Omit to use the shortest length within the angle limits.
# transition_length = 20.0
max_expansion_half_angle = 15.0
max_contraction_half_angle = 40.0
gasket_lip_width = 2.5
gasket_lip_thickness = 2.0
# Lips only on the motherboard side and the bottom. The lid butts the top (GPU too close for a lip)
# and the shroud wall butts the side-panel side, flush with the flange so it prints wall-down.
gasket_lip_sides = ["y_min", "z_min"]
outlet_gasket_thickness = 2.5
flange_chamfer = 1.0
zip_tie_slot_width = 4.0
zip_tie_slot_height = 2.0
zip_tie_pair_spacing = 10.0

[plugs]
plug_clearance = 0.3
plug_depth = 10.0
plug_plate_thickness = 2.0
plug_handle_height = 8.0
plug_handle_length = 30.0
plug_handle_thickness = 2.0

[tray]
tray_thickness = 1.6
tray_y_min = 2.0
tray_lip_height = 2.0
tray_lip_width = 2.0
tray_edge_margin = 6.0
peg_clearance = 0.2
pin_head_diameter = 6.0
pin_head_thickness = 1.6
pin_protrusion = 1.0
pin_hole_clearance = 0.1
pin_count_x = 3
pin_count_y = 2

[cover]
# Case mount only: passive lid and side wall that close the slot area between the outlet and the exhaust gap.
side_cover = true
cover_edge_chamfer = 1.5

[shroud]
# Card-clip shroud: side wall with a dovetail groove per card plus a bottom plate; a TPU grip slides into
# each groove from the bracket end and goes onto its card's top edge with the shroud. The top card's PCB
# is the roof, so there is no lid.
pcb_thickness = 1.57
# Motherboard surface -> bottom edge of a seated PCB.
pcb_seat_offset = 3.5
# The wall sits at this PCB height (CEM low-profile maximum), so any low-profile card fits without a
# shroud change; shorter cards get a taller grip back.
reference_pcb_height = 68.9
# Per covered slot, bottom first:
#   SLOT1: XZSNET X540-T2 clone (Intel X540-AT2), length TODO, 152 assumed.
#   SLOT2: Mellanox MCX556N (ConnectX-5 Ex, dual QSFP28). NVIDIA lists the MCX556A family at 142.24 x 68.90;
#          the N variant is undocumented, so measure it.
#   SLOT3: Dell OEM Broadcom 57412 (BCM957412A4120DC, DP/N 0GMW01, re-flashed), standard half-length.
# TODO: verify each length and PCB height on the card.
# SLOT3's 170 mm measured 2026-10-18 (bracket to tail); the two lower cards are still estimates.
card_lengths = [152.0, 142.24, 170.0]
card_pcb_heights = [68.9, 68.9, 68.9]
# Where a shorter card's gap to the wall is filled: "grip" grows that card's grip back (shroud stays
# card-agnostic), "wall" pads the pocket instead (grips identical, shroud card-specific).
grip_fill = "grip"
# Grip: how far its lips reach down each face of the PCB, lip thickness, and the squeeze on the PCB.
# The whole grip is soft TPU (grip_material), so the lips mould over the small parts the Dell 57412
# carries within 2 to 3 mm of its top edge.
grip_engagement = 2.5
grip_wall = 1.5
grip_interference = 0.2
# Every grip back is at least this thick: the dovetail key plus tpu_min_wall_thickness above the channel.
grip_back_min = 5.5
# Dovetail key on the grip back: depth from the back face to the neck, and flank angle from the
# wall normal. The key widens by dovetail_depth * tan(dovetail_angle) per side toward the wall.
dovetail_depth = 2.5
dovetail_angle = 30.0
# TPU parts print fine at three perimeters.
tpu_min_wall_thickness = 1.2
# Grip stops this far from the card tail and from the exhaust gap.
grip_margin = 4.0
# Dovetail groove around each grip: clearance per side, rib thickness at the root, and how far the ribs
# reach in from the wall (grip_fill = "grip") or down past the card edge (grip_fill = "wall").
pocket_clearance = 0.2
pocket_rib = 1.6
pocket_reach = 2.5
# Duct roof sits this far above the top card's PCB back.
roof_clearance = 0.3
# Lid stub from the flange past the top card's tail by this much.
stub_overlap = 2.0

[mount]
# "card_clip": shroud rides on the cards' edges, nothing touches the midplate.
# "case": floor tray pegged into the midplate carries the duct and a separate cover.
mount_style = "card_clip"
joint_gasket_thickness = 1.0
mount_bar_depth = 9.0
mount_groove_clearance = 0.3
groove_fence_height = 7.0
# Foot under the fan pinned into the midplate; off until the cutout positions are known.
fan_foot = false
foot_depth = 16.0
foot_overlap = 1.0
foot_pin_count = 2

[booster]
booster = "none"
booster_fan_size = 120.0
booster_fan_depth = 15.0
booster_hole_spacing = 105.0
booster_hole_diameter = 4.3
booster_intake_clearance = 15.0

[print]
material = "ABS"
# Edge grips: one TPU body each. Spools on hand: Elegoo TPU 72D (Shore D, harder than 95A) and TPU 95A.
grip_material = "TPU 95A"
# Case mount only: outlet gasket of the separate duct (softest grade on hand).
gasket_material = "TPU 95A"

[tail]
# Card-clip: a 60 mm fan bolts straight onto the shroud's tail end wall, which sits tail_clearance past
# the longest card. Its standard fan screws go in from inside the shroud (open motherboard side).
tail_fan_size = 60.0
tail_fan_depth = 25.0
tail_fan_hole_spacing = 50.0
# Round opening in the tail wall, about the blade sweep of a 60 mm fan.
tail_fan_opening = 57.0
# Fan axis overrides. Omit to centre on the card zone.
# tail_fan_center_y = 38.0
# tail_fan_center_z = 33.0
tail_clearance = 4.0
tail_wall_thickness = 3.0
# TODO: free length past the longest card's tail before the PSU cables (fan needs tail_clearance +
# tail_wall_thickness + tail_fan_depth).
free_length_past_cards = 35.0

[bracket]
# Card-clip: a tab on the arms lies on the covered cards' PCI bracket tabs, under the bracket screws
# (screw axis along Y, toward the motherboard). TODO: measure all three on the case.
# Y of the bracket tabs' outer face, from the motherboard surface.
bracket_tab_y = 110.0
# X of the screw axis (negative = inside the case, toward the cards).
bracket_screw_x = -6.0
# Z offset of each screw from its card's PCB plane.
bracket_screw_dz = 0.0
bracket_tab_thickness = 2.0
# Ear length along the cards, centred on the screw.
bracket_tab_depth = 12.0
bracket_screw_clearance = 4.0
# Each rib and its ear are this thick along the slot stack, centred on the screw.
bracket_arm_width = 10.0
# Ridge along each long edge of a rib's upper side, from the wall up to the ear and along it; the
# ridges stop where they would sit under a screw head of bracket_screw_head_clearance (0 height: none).
bracket_ridge_width = 1.6
bracket_ridge_height = 2.0
# TODO: bracket screw head diameter plus about 0.5 mm.
bracket_screw_head_clearance = 8.0

[todo]
unmeasured = [
  "bottom_slot_pcb_to_midplate",
  "gpu_underside_below_pcb",
  "card_lengths",
  "card_pcb_heights",
  "side_clearance",
  "free_length_from_outlet",
  "free_length_past_cards",
  "bracket_tab_y",
  "bracket_screw_x",
  "bracket_screw_dz",
  "bracket_screw_head_clearance",
  "under_midplate_gap",
  "cutouts",
  "slot_length",
  "slot_width",
  "hole_pitch",
  "hole_row_pitch_override",
  "sheet_thickness",
  "perforation_origin_x",
  "perforation_origin_y",
]
